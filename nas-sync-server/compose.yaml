services:
  guanpan-nas-sync:
    image: python:3.12-alpine
    container_name: guanpan-nas-sync
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "/app/server.py"]
    ports:
      - "8787:8787"
    volumes:
      - ./server.py:/app/server.py:ro
      - ./web:/app/web:ro
      - guanpan_sync_data:/data
    environment:
      PORT: "8787"
      DATA_DIR: "/data"
      # Leave empty to generate a strong token on first startup.
      SYNC_TOKEN: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/ping', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
volumes:
  guanpan_sync_data:
    name: guanpan_pro_sync_data
